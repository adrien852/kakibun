<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#faf6ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kakibun</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HOME ============ -->
<main id="home" class="screen">
  <header class="top">
    <div class="brand"><span class="brand-torii">⛩</span> Kakibun</div>
    <div id="streak-pill" class="streak-pill" hidden>🔥 <b id="streak-n">0</b></div>
  </header>

  <section id="newkanji-card" class="card newkanji" hidden>
    <div class="nk-title" id="newkanji-title"></div>
    <div class="nk-chars" id="newkanji-chars"></div>
    <div class="nk-body" id="newkanji-body"></div>
    <div class="nk-btns">
      <button id="newkanji-later" class="btn small ghost"></button>
      <button id="newkanji-go" class="btn small primary"></button>
    </div>
  </section>

  <section id="kakikana-banner" class="card banner" hidden>
    <div class="banner-txt" id="kakikana-banner-txt"></div>
    <button id="kakikana-import-btn" class="btn small"></button>
  </section>

  <section class="card hero">
    <div class="hero-line1" id="hero-title"></div>
    <div class="hero-line2" id="hero-sub"></div>
    <div class="hero-station" id="hero-station"></div>
    <button id="go-session" class="btn big primary"></button>
    <div class="hero-day" id="hero-day"></div>
  </section>

  <section class="card statrow">
    <div class="stat"><div class="stat-n" id="stat-points">0</div><div class="stat-l" id="stat-points-l"></div></div>
    <div class="stat"><div class="stat-n" id="stat-mastered">0</div><div class="stat-l" id="stat-mastered-l"></div></div>
    <div class="stat"><div class="stat-n" id="stat-sentences">0</div><div class="stat-l" id="stat-sentences-l"></div></div>
    <div class="stat"><div class="stat-n" id="stat-kanji">0</div><div class="stat-l" id="stat-kanji-l"></div></div>
  </section>

  <section class="card" id="due-card" hidden>
    <div class="card-title" id="due-title"></div>
    <div id="due-list" class="due-list"></div>
  </section>
</main>

<!-- ============ MAP ============ -->
<main id="map" class="screen" hidden>
  <header class="top"><div class="brand" id="map-title"></div></header>
  <div id="map-scroll" class="map-scroll"></div>
</main>

<!-- ============ STRENGTHEN ============ -->
<main id="strengthen" class="screen" hidden>
  <header class="top"><div class="brand" id="str-title"></div></header>
  <div id="str-body" class="set-body"></div>
</main>

<!-- ============ LIBRARY ============ -->
<main id="library" class="screen" hidden>
  <header class="top"><div class="brand" id="lib-title"></div></header>
  <div id="lib-body" class="lib-body"></div>
</main>

<!-- ============ SETTINGS ============ -->
<main id="settings" class="screen" hidden>
  <header class="top"><div class="brand" id="set-title"></div></header>
  <div id="set-body" class="set-body"></div>
</main>

<!-- ============ SESSION (overlay) ============ -->
<main id="session" class="screen overlay" hidden>
  <header class="sess-top">
    <button id="sess-quit" class="iconbtn">✕</button>
    <div class="sess-bar"><div id="sess-bar-fill" class="sess-bar-fill"></div></div>
    <div id="combo" class="combo" hidden>×<b id="combo-n">1</b></div>
  </header>
  <div id="sess-body" class="sess-body"></div>
  <footer id="sess-foot" class="sess-foot"></footer>
</main>

<!-- word popup -->
<div id="wordpop" class="wordpop" hidden></div>
<!-- toasts -->
<div id="toast-root"></div>

<nav id="nav" class="nav">
  <button data-nav="home" class="nav-btn on"><span class="nav-ico">🏠</span><span class="nav-l" id="nav-home"></span></button>
  <button data-nav="map" class="nav-btn"><span class="nav-ico">🗾</span><span class="nav-l" id="nav-map"></span></button>
  <button data-nav="strengthen" class="nav-btn"><span class="nav-ico">🎯</span><span class="nav-l" id="nav-strengthen"></span></button>
  <button data-nav="library" class="nav-btn"><span class="nav-ico">📚</span><span class="nav-l" id="nav-library"></span></button>
  <button data-nav="settings" class="nav-btn"><span class="nav-ico">⚙️</span><span class="nav-l" id="nav-settings"></span></button>
</nav>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="restore-file" accept="application/json,.json" hidden>

<script src="data/i18n.js"></script>
<script src="data/kanji_info.js"></script>
<script src="data/particles.js"></script>
<script src="data/grammar.js"></script>
<script src="data/lexicon.js"></script>
<script src="data/sentences.js"></script>
<script src="js/conjugate.js"></script>
<script src="js/parse.js"></script>
<script src="js/bridge.js"></script>
<script src="js/engine.js"></script>
<script src="js/sfx.js"></script>
<script src="js/voice.js"></script>
<script src="js/wordpop.js"></script>
<script src="js/session.js"></script>
<script src="js/exam.js"></script>
<script src="js/map.js"></script>
<script src="js/strengthen.js"></script>
<script src="js/library.js"></script>
<script src="js/sync.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
