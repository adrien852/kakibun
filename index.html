<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kakibun</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="32x32 16x16">
<link rel="icon" href="icons/icon-master.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/zkgn-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/zkgn-900.woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<!-- these two load early on purpose: the launch screen below is painted before
     first frame, and it must already be in today's season. Both are pure
     derivation with no DOM dependency. -->
<script src="js/season.js"></script>
<script src="js/mark.js"></script>
</head>
<body>

<!-- the launch screen. Painted before anything else and removed once the app
     has drawn, so the first frame is the mark rather than an empty valley. -->
<div id="launch" aria-hidden="true">
  <div class="lx-light"></div>
  <div class="lx-ridge lx-back"></div>
  <div class="lx-ridge lx-front"></div>
  <div class="lx-stack">
    <div class="lx-glyph" id="lx-glyph"></div>
    <div class="lx-word">kakibun</div>
    <div class="lx-poetic" id="lx-poetic"></div>
  </div>
</div>
<script>Mark.paintLaunch();</script>

<!-- the landscape every screen stands on; built by js/scene.js -->
<div id="scene" aria-hidden="true"></div>

<div id="app">

  <!-- ============ ACCUEIL ============ -->
  <main id="home" class="screen">
    <div class="status-row">
      <span class="pill" id="status-place"></span>
      <span class="pill ui" id="status-streak" hidden></span>
    </div>

    <div class="head-block">
      <div class="headline" id="head-season"></div>
      <div class="head-poetic" id="head-poetic"></div>
    </div>

    <div class="home-bottom">
      <section class="card" id="newkanji-card" hidden>
        <div class="eyebrow" id="newkanji-title"></div>
        <div class="nk-chars" id="newkanji-chars"></div>
        <div class="sess-sub" id="newkanji-body"></div>
        <div class="nk-btns">
          <button id="newkanji-later" class="nk-later"></button>
          <button id="newkanji-go" class="nk-go"></button>
        </div>
      </section>

      <section class="card banner" id="kakikana-banner" hidden>
        <div class="txt" id="kakikana-banner-txt"></div>
        <button id="kakikana-import-btn"></button>
      </section>

      <section class="panel">
        <div class="eyebrow" id="sess-eyebrow"></div>
        <div class="sess-pat" id="sess-pat"></div>
        <div class="sess-sub" id="sess-desc"></div>
        <button id="go-session" class="btn-primary"></button>
      </section>

      <section class="card" id="missions-card" hidden>
        <div class="mis-head">
          <span class="eyebrow" id="missions-title"></span>
          <span class="eyebrow-n" id="missions-count"></span>
        </div>
        <div class="mis-list" id="missions-list"></div>
      </section>

      <div class="stat-row">
        <button class="stat-btn" data-nav="journey">
          <div class="stat-n" id="stat-stops"></div>
          <div class="stat-l" id="stat-stops-l"></div>
        </button>
        <button class="stat-btn" data-nav="strengthen">
          <div class="stat-n accent" id="stat-weak"></div>
          <div class="stat-l" id="stat-weak-l"></div>
        </button>
        <button class="stat-btn" data-nav="library">
          <div class="stat-n" id="stat-kanji"></div>
          <div class="stat-l" id="stat-kanji-l"></div>
        </button>
      </div>
    </div>
  </main>

  <!-- ============ VOYAGE ============ -->
  <main id="journey" class="screen" hidden>
    <div class="j-head">
      <span class="scr-title" id="journey-title"></span>
      <span class="pill" id="journey-pill"></span>
    </div>
    <div id="journey-body"></div>
  </main>

  <!-- ============ EXERCICE ============ -->
  <main id="strengthen" class="screen" hidden>
    <div style="flex:none">
      <div class="scr-title" id="str-title"></div>
      <div class="scr-sub" id="str-sub"></div>
    </div>
    <div id="str-body"></div>
  </main>

  <!-- ============ CARNET ============ -->
  <main id="library" class="screen" hidden>
    <div class="scr-title" id="lib-title" style="flex:none"></div>
    <div class="lib-tabs" id="lib-tabs"></div>
    <div class="lib-body" id="lib-body"></div>
  </main>

  <!-- ============ RÉGLAGES ============ -->
  <main id="settings" class="screen" hidden>
    <div class="scr-title" id="set-title" style="flex:none"></div>
    <div id="set-body"></div>
  </main>

  <nav id="nav">
    <button data-nav="home" class="nav-btn on" id="nav-home"></button>
    <button data-nav="journey" class="nav-btn" id="nav-journey"></button>
    <button data-nav="strengthen" class="nav-btn" id="nav-strengthen"></button>
    <button data-nav="library" class="nav-btn" id="nav-library"></button>
    <button data-nav="settings" class="nav-btn" id="nav-settings"></button>
  </nav>
</div>

<!-- ============ SESSION (overlay) ============ -->
<main id="session" hidden>
  <div class="sess-top">
    <button id="sess-quit" class="sess-quit">✕</button>
    <div class="sess-track"><i id="sess-bar-fill" style="width:0%"></i></div>
    <span id="combo" class="combo" hidden>×<b id="combo-n">1</b></span>
  </div>
  <div class="kind" id="sess-kind"></div>
  <div id="sess-body"></div>
  <div id="sess-foot"></div>
</main>

<div id="wordpop" hidden></div>
<div id="toast-root"></div>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="restore-file" accept="application/json,.json" hidden>

<script src="data/i18n.js"></script>
<script src="data/kanji_info.js"></script>
<script src="data/particles.js"></script>
<script src="data/grammar.js"></script>
<script src="data/lexicon.js"></script>
<script src="data/sentences.js"></script>
<script src="data/notes.js"></script>
<script src="data/dialogues.js"></script>
<script src="js/conjugate.js"></script>
<script src="js/parse.js"></script>
<script src="js/kana.js"></script>
<script src="js/bridge.js"></script>
<script src="js/scene.js"></script>
<script src="js/engine.js"></script>
<script src="js/sfx.js"></script>
<script src="js/voice.js"></script>
<script src="js/wordpop.js"></script>
<script src="js/session.js"></script>
<script src="js/exam.js"></script>
<script src="js/map.js"></script>
<script src="js/strengthen.js"></script>
<script src="js/library.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
